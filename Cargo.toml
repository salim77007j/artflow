[package]
name = "artflow"
version = "0.1.0"
edition = "2021"
authors = ["ArtFlow Studio"]
description = "ArtFlow — a modern, professional image editor and digital drawing studio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/salim77007j/artflow"

[[bin]]
name = "artflow"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[dependencies]
# UI framework — egui is immediate mode, ideal for a creative tool
egui = { version = "0.29", features = ["serde", "default-fonts"] }
eframe = { version = "0.29", features = ["default_fonts", "persistence"] }
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }

# 2D vector types
glam = "0.29"

# Image format support
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "tiff", "webp",
    "tga", "dds", "hdr", "openexr", "ff", "rayon",
] }
imageproc = { version = "0.25", default-features = false }

# Color and palette helpers
palette = "0.7"

# Serialization (project save)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rmp-serde = "1"

# Filesystem dialogs
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }

# Random (for noise filters)
rand = "0.8"
fastrand = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1"
anyhow = "1"

# Threading (used for non-blocking filters / export)
rayon = "1"

# Tiny drawing math helpers
smallvec = "1"

[dev-dependencies]
tempfile = "3"