name: Build ArtFlow

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu (debug)
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Set up build profile
        id: profile
        run: |
          if [[ "${{ matrix.target }}" == *"debug"* ]]; then
            echo "profile=debug" >> $GITHUB_OUTPUT
          else
            echo "profile=release" >> $GITHUB_OUTPUT
          fi

      - name: Check
        run: cargo check --${{ steps.profile.outputs.profile }}

      - name: Build
        run: cargo build --${{ steps.profile.outputs.profile }} --target ${{ matrix.target }} --verbose

      - name: Test
        if: steps.profile.outputs.profile == 'debug'
        run: cargo test --${{ steps.profile.outputs.profile }} --verbose

      - name: Strip & package binary
        if: steps.profile.outputs.profile == 'release'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/artflow artifacts/artflow-linux-x86_64
          chmod +x artifacts/artflow-linux-x86_64
          cd artifacts && tar czf artflow-linux-x86_64.tar.gz artflow-linux-x86_64

      - name: Upload release artifact
        if: steps.profile.outputs.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: artflow-linux-x86_64
          path: artifacts/artflow-linux-x86_64.tar.gz
          if-no-files-found: error